name: Build and deploy static site

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pandoc build-essential libffi-dev libgmp-dev libncurses-dev
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
      - name: Install pandoc-sidenote
        run: cabal install pandoc-sidenote --install-method=copy --installdir="$HOME/.cabal/bin"
      - name: Run Makefile
        run: make
      - name: Upload static files as artifact
        if: github.event_name == 'push'
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
  deploy:
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
